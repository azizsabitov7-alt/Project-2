<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Тест кнопок</title>
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        body {
            font-family: Arial;
            padding: 20px;
            text-align: center;
        }
        .test-btn {
            display: block;
            width: 90%;
            margin: 20px auto;
            padding: 25px;
            font-size: 20px;
            background: #4285f4;
            color: white;
            border: none;
            border-radius: 15px;
            cursor: pointer;
        }
        .test-btn:active {
            background: #3367d6;
            transform: scale(0.98);
        }
        #result {
            margin-top: 30px;
            padding: 15px;
            background: #f0f0f0;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <h1>📱 Тест кнопок</h1>
    
    <button class="test-btn" id="btn1">Кнопка 1 (click)</button>
    <button class="test-btn" id="btn2">Кнопка 2 (touchstart)</button>
    <button class="test-btn" id="btn3">Кнопка 3 (оба события)</button>
    
    <div id="result">Нажмите кнопку...</div>
    
    <script>
        const result = document.getElementById('result');
        
        // Кнопка 1 - только click
        document.getElementById('btn1').addEventListener('click', function() {
            result.textContent = 'Кнопка 1 нажата (click)';
            console.log('Кнопка 1 - click');
        });
        
        // Кнопка 2 - только touchstart
        document.getElementById('btn2').addEventListener('touchstart', function(e) {
            e.preventDefault();
            result.textContent = 'Кнопка 2 нажата (touchstart)';
            console.log('Кнопка 2 - touchstart');
        }, {passive: false});
        
        // Кнопка 3 - оба события
        const btn3 = document.getElementById('btn3');
        btn3.addEventListener('click', function() {
            result.textContent = 'Кнопка 3 нажата (click)';
            console.log('Кнопка 3 - click');
        });
        btn3.addEventListener('touchstart', function(e) {
            e.preventDefault();
            result.textContent = 'Кнопка 3 нажата (touchstart)';
            console.log('Кнопка 3 - touchstart');
        }, {passive: false});
        
        console.log('Тест загружен');
    </script>
</body>
</html>
