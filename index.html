<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo - Синхронизация</title>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <!-- Стили -->
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 20px auto; padding: 20px; }
        input, button { padding: 10px; margin: 5px; }
        .task { padding: 10px; border: 1px solid #ddd; margin: 5px 0; display: flex; justify-content: space-between; }
        .completed { text-decoration: line-through; color: #888; }
        #auth { background: #f0f0f0; padding: 20px; border-radius: 10px; margin: 20px 0; }
        #app { display: none; }
    </style>
</head>
<body>
    <h1>📝 Todo App</h1>
    
    <!-- Авторизация -->
    <div id="auth">
        <h3>Вход для синхронизации:</h3>
        <button id="loginGoogle">Войти через Google</button>
        <button id="loginLocal">Локальный режим</button>
        <p><small>Project ID: sync-todo-app-e617f</small></p>
    </div>
    
    <!-- Основное приложение -->
    <div id="app">
        <h3>Привет, <span id="userEmail"></span>!</h3>
        
        <!-- Добавление задачи -->
        <div>
            <input type="text" id="taskInput" placeholder="Новая задача..." style="width: 70%;">
            <button id="addTask">Добавить</button>
        </div>
        
        <!-- Фильтры -->
        <div style="margin: 10px 0;">
            <button class="filter" data-filter="all">Все</button>
            <button class="filter" data-filter="active">Активные</button>
            <button class="filter" data-filter="completed">Выполненные</button>
        </div>
        
        <!-- Список задач -->
        <div id="taskList"></div>
        
        <!-- Статистика -->
        <div style="margin-top: 20px;">
            <p>Всего: <span id="total">0</span> | Выполнено: <span id="completed">0</span></p>
            <button id="clearCompleted">Очистить выполненные</button>
            <button id="logout">Выйти</button>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
