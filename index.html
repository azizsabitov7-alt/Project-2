<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo - Простая синхронизация</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background: #f5f5f5;
        }
        
        .container {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }
        
        /* Секция синхронизации */
        .sync-section {
            background: #e6f7ff;
            border: 2px solid #91d5ff;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            text-align: center;
        }
        
        .sync-code {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 3px;
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            border: 2px dashed #1890ff;
        }
        
        .code-input {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            text-align: center;
            border: 2px solid #ddd;
            border-radius: 8px;
            margin: 10px 0;
            letter-spacing: 3px;
        }
        
        .btn {
            padding: 15px 25px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin: 5px;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: #1890ff;
            color: white;
        }
        
        .btn-primary:hover {
            background: #096dd9;
        }
        
        .btn-success {
            background: #52c41a;
            color: white;
        }
        
        .btn-success:hover {
            background: #389e0d;
        }
        
        /* Форма задачи */
        .task-form {
            display: flex;
            gap: 10px;
            margin: 20px 0;
        }
        
        .task-input {
            flex: 1;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }
        
        /* Список задач */
        .task-item {
            padding: 15px;
            margin: 10px 0;
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .task-checkbox {
            width: 22px;
            height: 22px;
        }
        
        .task-text {
            flex: 1;
            font-size: 16px;
        }
        
        .task-text.completed {
            text-decoration: line-through;
            color: #888;
        }
        
        .delete-btn {
            background: #ff4d4f;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
        }
        
        /* Статистика */
        .stats {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #eee;
        }
        
        /* Уведомления */
        .alert {
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
            text-align: center;
            display: none;
        }
        
        .alert-success {
            background: #f6ffed;
            border: 2px solid #b7eb8f;
            color: #52c41a;
        }
        
        .alert-info {
            background: #e6f7ff;
            border: 2px solid #91d5ff;
            color: #1890ff;
        }
        
        /* QR код */
        .qrcode {
            margin: 20px auto;
            text-align: center;
        }
        
        @media (max-width: 600px) {
            body {
                padding: 10px;
            }
            
            .container {
                padding: 15px;
            }
            
            .task-form {
                flex-direction: column;
            }
            
            .btn {
                width: 100%;
                margin: 5px 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 Todo с синхронизацией</h1>
        
        <!-- Секция синхронизации -->
        <div class="sync-section">
            <h3>🔗 Синхронизация между устройствами</h3>
            
            <div class="alert alert-info" id="syncAlert"></div>
            
            <div id="syncCreate">
                <p>Создайте код доступа на первом устройстве:</p>
                <div class="sync-code" id="generatedCode">--- ---</div>
                <button class="btn btn-primary" onclick="generateCode()">Создать код</button>
                
                <div class="qrcode">
                    <div id="qrcode"></div>
                    <p><small>Или покажите QR-код другому устройству</small></p>
                </div>
            </div>
            
            <div id="syncJoin" style="display: none;">
                <p>Введите код с другого устройства:</p>
                <input type="text" 
                       class="code-input" 
                       id="joinCode" 
                       placeholder="000-000" 
                       maxlength="7"
                       oninput="formatCode(this)">
                <button class="btn btn-success" onclick="joinWithCode()">Присоединиться</button>
                <button class="btn" onclick="showCreate()">Создать новый</button>
            </div>
            
            <div id="syncConnected" style="display: none;">
                <p>✅ Синхронизация активна</p>
                <p><small>Код: <span id="currentCode"></span></small></p>
                <button class="btn" onclick="disconnectSync()">Отключить синхронизацию</button>
            </div>
        </div>
        
        <!-- Основное приложение -->
        <div id="app" style="display: none;">
            <!-- Форма добавления -->
            <div class="task-form">
                <input type="text" 
                       class="task-input" 
                       id="taskInput" 
                       placeholder="Новая задача..."
                       onkeypress="if(event.key=='Enter') addTask()">
                <button class="btn btn-primary" onclick="addTask()">Добавить</button>
            </div>
            
            <!-- Список задач -->
            <div id="taskList">
                <p style="text-align: center; color: #888; padding: 40px;">Задач пока нет</p>
            </div>
            
            <!-- Статистика -->
            <div class="stats">
                <div>Всего: <span id="totalTasks">0</span></div>
                <div>Выполнено: <span id="completedTasks">0</span></div>
                <button class="btn" onclick="clearCompleted()">Очистить выполненные</button>
            </div>
        </div>
    </div>
    
    <!-- Библиотека для QR кодов -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    
    <script>
        // Глобальные переменные
        let tasks = [];
        let syncCode = null;
        let syncInterval = null;
        
        // Загрузка при старте
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Приложение загружено');
            
            // Проверяем, есть ли сохраненный код синхронизации
            const savedCode = localStorage.getItem('todo_sync_code');
            const savedTasks = localStorage.getItem('todo_tasks');
            
            if (savedCode) {
                // Уже есть синхронизация
                syncCode = savedCode;
                connectToSync(savedCode);
            } else if (savedTasks) {
                // Есть локальные задачи
                tasks = JSON.parse(savedTasks);
                showApp();
                renderTasks();
            }
            
            // Генерируем начальный код
            generateCode();
        });
        
        // ===== СИНХРОНИЗАЦИЯ =====
        
        // Создать код синхронизации
        function generateCode() {
            // Генерируем код вида 123-456
            const code = Math.floor(100 + Math.random() * 900) + '-' + 
                         Math.floor(100 + Math.random() * 900);
            
            syncCode = code;
            document.getElementById('generatedCode').textContent = code;
            
            // Показываем создание кода
            document.getElementById('syncCreate').style.display = 'block';
            document.getElementById('syncJoin').style.display = 'none';
            
            // Генерируем QR-код
            generateQRCode(code);
            
            showAlert('Создан код: ' + code, 'info');
        }
        
        // Присоединиться по коду
        function joinWithCode() {
            const code = document.getElementById('joinCode').value.trim();
            
            if (!code || code.length !== 7) {
                showAlert('Введите корректный код (000-000)', 'info');
                return;
            }
            
            connectToSync(code);
        }
        
        // Подключиться к синхронизации
        function connectToSync(code) {
            syncCode = code;
            localStorage.setItem('todo_sync_code', code);
            
            // Сохраняем текущие задачи перед синхронизацией
            saveTasks();
            
            // Показываем статус подключения
            document.getElementById('syncCreate').style.display = 'none';
            document.getElementById('syncJoin').style.display = 'none';
            document.getElementById('syncConnected').style.display = 'block';
            document.getElementById('currentCode').textContent = code;
            
            // Показываем основное приложение
            showApp();
            
            // Загружаем задачи из синхронизации
            loadSyncedTasks();
            
            // Запускаем синхронизацию
            startSync();
            
            showAlert('✅ Синхронизация подключена!', 'success');
        }
        
        // Отключить синхронизацию
        function disconnectSync() {
            syncCode = null;
            localStorage.removeItem('todo_sync_code');
            
            // Останавливаем синхронизацию
            if (syncInterval) {
                clearInterval(syncInterval);
                syncInterval = null;
            }
            
            // Возвращаем к выбору
            document.getElementById('syncCreate').style.display = 'block';
            document.getElementById('syncConnected').style.display = 'none';
            
            showAlert('Синхронизация отключена', 'info');
        }
        
        // Показать создание кода
        function showCreate() {
            document.getElementById('syncCreate').style.display = 'block';
            document.getElementById('syncJoin').style.display = 'none';
        }
        
        // Показать присоединение
        function showJoin() {
            document.getElementById('syncCreate').style.display = 'none';
            document.getElementById('syncJoin').style.display = 'block';
        }
        
        // ===== СИНХРОНИЗАЦИЯ ДАННЫХ =====
        
        // Запустить синхронизацию
        function startSync() {
            // Синхронизируем каждые 10 секунд
            syncInterval = setInterval(syncTasks, 10000);
            
            // Первая синхронизация сразу
            syncTasks();
        }
        
        // Синхронизировать задачи
        async function syncTasks() {
            if (!syncCode) return;
            
            try {
                // Используем GitHub Gist как простой "сервер"
                // Каждый код синхронизации = свой файл
                const syncData = {
                    tasks: tasks,
                    lastUpdate: Date.now(),
                    device: navigator.userAgent.substring(0, 50)
                };
                
                // Сохраняем в localStorage как временное решение
                // В реальном приложении здесь был бы запрос к серверу
                localStorage.setItem('sync_' + syncCode, JSON.stringify(syncData));
                
                // Показываем статус
                document.getElementById('syncAlert').textContent = 
                    'Синхронизировано: ' + new Date().toLocaleTimeString();
                document.getElementById('syncAlert').style.display = 'block';
                
                setTimeout(() => {
                    document.getElementById('syncAlert').style.display = 'none';
                }, 2000);
                
            } catch (error) {
                console.error('Ошибка синхронизации:', error);
            }
        }
        
        // Загрузить синхронизированные задачи
        function loadSyncedTasks() {
            if (!syncCode) return;
            
            // Загружаем из localStorage
            const saved = localStorage.getItem('sync_' + syncCode);
            
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    
                    // Проверяем, что данные новее наших
                    const lastUpdate = localStorage.getItem('last_update_' + syncCode) || 0;
                    
                    if (data.lastUpdate > lastUpdate) {
                        tasks = data.tasks;
                        localStorage.setItem('last_update_' + syncCode, data.lastUpdate);
                        renderTasks();
                        showAlert('Задачи загружены', 'success');
                    }
                    
                } catch (error) {
                    console.error('Ошибка загрузки синхронизации:', error);
                }
            }
        }
        
        // ===== ОСНОВНЫЕ ФУНКЦИИ =====
        
        // Показать основное приложение
        function showApp() {
            document.getElementById('app').style.display = 'block';
        }
        
        // Добавить задачу
        function addTask() {
            const input = document.getElementById('taskInput');
            const text = input.value.trim();
            
            if (!text) {
                showAlert('Введите текст задачи', 'info');
                return;
            }
            
            const newTask = {
                id: Date.now(),
                text: text,
                completed: false,
                createdAt: new Date().toISOString()
            };
            
            tasks.unshift(newTask);
            saveTasks();
            renderTasks();
            syncTasks(); // Сразу синхронизируем
            
            input.value = '';
            input.focus();
            
            showAlert('Задача добавлена', 'success');
        }
        
        // Переключить статус задачи
        function toggleTask(id) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.completed = !task.completed;
                saveTasks();
                renderTasks();
                syncTasks();
            }
        }
        
        // Удалить задачу
        function deleteTask(id) {
            if (!confirm('Удалить задачу?')) return;
            
            tasks = tasks.filter(t => t.id !== id);
            saveTasks();
            renderTasks();
            syncTasks();
            
            showAlert('Задача удалена', 'success');
        }
        
        // Очистить выполненные
        function clearCompleted() {
            const completedCount = tasks.filter(t => t.completed).length;
            
            if (completedCount === 0) {
                showAlert('Нет выполненных задач', 'info');
                return;
            }
            
            if (!confirm(`Удалить ${completedCount} выполненных задач?`)) return;
            
            tasks = tasks.filter(t => !t.completed);
            saveTasks();
            renderTasks();
            syncTasks();
            
            showAlert(`Удалено ${completedCount} задач`, 'success');
        }
        
        // Отобразить задачи
        function renderTasks() {
            const container = document.getElementById('taskList');
            
            if (tasks.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #888; padding: 40px;">Задач пока нет</p>';
            } else {
                container.innerHTML = tasks.map(task => `
                    <div class="task-item">
                        <input type="checkbox" 
                               class="task-checkbox" 
                               ${task.completed ? 'checked' : ''}
                               onchange="toggleTask(${task.id})">
                        <span class="task-text ${task.completed ? 'completed' : ''}">
                            ${escapeHtml(task.text)}
                        </span>
                        <button class="delete-btn" onclick="deleteTask(${task.id})">✕</button>
                    </div>
                `).join('');
            }
            
            updateStats();
        }
        
        // Обновить статистику
        function updateStats() {
            document.getElementById('totalTasks').textContent = tasks.length;
            document.getElementById('completedTasks').textContent = 
                tasks.filter(t => t.completed).length;
        }
        
        // Сохранить задачи
        function saveTasks() {
            localStorage.setItem('todo_tasks', JSON.stringify(tasks));
            
            // Если есть синхронизация - сохраняем и её
            if (syncCode) {
                localStorage.setItem('sync_' + syncCode, JSON.stringify({
                    tasks: tasks,
                    lastUpdate: Date.now()
                }));
            }
        }
        
        // ===== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ =====
        
        // Показать уведомление
        function showAlert(message, type = 'info') {
            const alert = document.getElementById('syncAlert');
            alert.textContent = message;
            alert.className = `alert alert-${type}`;
            alert.style.display = 'block';
            
            setTimeout(() => {
                alert.style.display = 'none';
            }, 3000);
            
            console.log(message);
        }
        
        // Сгенерировать QR-код
        function generateQRCode(code) {
            const container = document.getElementById('qrcode');
            container.innerHTML = '';
            
            QRCode.toCanvas(container, code, {
                width: 150,
                height: 150,
                margin: 1,
                color: {
                    dark: '#000000',
                    light: '#ffffff'
                }
            }, function(error) {
                if (error) console.error('QR Code error:', error);
            });
        }
        
        // Форматировать код (добавить дефис)
        function formatCode(input) {
            let value = input.value.replace(/\D/g, '');
            
            if (value.length > 3) {
                value = value.substring(0, 3) + '-' + value.substring(3, 6);
            }
            
            input.value = value.substring(0, 7);
        }
        
        // Экранировать HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // Сделать функции глобальными
        window.addTask = addTask;
        window.toggleTask = toggleTask;
        window.deleteTask = deleteTask;
        window.clearCompleted = clearCompleted;
        window.generateCode = generateCode;
        window.joinWithCode = joinWithCode;
        window.showCreate = showCreate;
        window.showJoin = showJoin;
        window.disconnectSync = disconnectSync;
        
        console.log('Приложение готово!');
    </script>
</body>
</html>
